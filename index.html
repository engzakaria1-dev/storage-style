<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="border">
      <div id="border1">
        <div class="header"><img src="./images/logo.svg" /></div>
        <div id="icons">
          <img src="./images/icon-document.svg" />
          <img src="./images/icon-folder.svg" />
          <img src="./images/icon-upload.svg" />
        </div>
      </div>
      <main class="storage-card" aria-label="Storage usage">
        <div class="remaining" aria-label="185 gigabytes left">
          <strong>185</strong><span>GB LEFT</span>
        </div>
        <p class="summary">
          You've used <strong>815 GB</strong> of your storage
        </p>
        <div class="meter" role="img" aria-label="815 of 1000 gigabytes used">
          <div class="meter-fill"></div>
        </div>
        <div class="scale"><span>0 GB</span><span>1000 GB</span></div>
      </main>
    </div>
  </body>
</html>
